# HailoRT service 버전: NPU를 호스트 hailort.service 경유로 다른 프로세스(Hailo Whisper STT)와 공유
#
# 켜기: .env에 COMPOSE_FILE=compose.yaml:compose.service.yaml 추가 → docker compose up -d --build frigate
# 끄기(standard로 복귀): 그 줄을 지우고 → docker compose up -d frigate
services:
  frigate:
    build:
      target: service
    image: localhost/frigate-hailort4.23-service:0.18.2
    # HailoRT 서비스가 클라이언트의 POSIX 공유 메모리(/dev/shm)를 열 수 있도록 호스트 IPC 사용
    ipc: host
    volumes:
      - /tmp/hailort_uds.sock:/tmp/hailort_uds.sock
